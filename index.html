<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Todo App</title>
  <link rel="icon" href="images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="background"></div>

  <div class="container">

    <header>
      <h1>TODO</h1>
      <img id="theme-btn" src="images/icon-sun.svg" alt="changer le thème">
    </header>

    
    <form id="form">
      <input type="text" id="input" placeholder="Créer une nouvelle tâche...">
    </form>

    
    <ul id="todo-list"></ul>

    
    <div class="footer">
      <span id="items-left">0 tâches restantes</span>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">Tout</button>
        <button class="filter-btn" data-filter="active">Actives</button>
        <button class="filter-btn" data-filter="completed">Terminées</button>
      </div>

      <button id="clear-btn">Effacer terminées</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
